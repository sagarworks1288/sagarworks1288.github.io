<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text Formatter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 15px;
      cursor: pointer;
    }
    .output {
      margin-top: 15px;
      padding: 10px;
      background: #f2f2f2;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Text Converter (ex1 → ex2)</h2>

  <p>Input (ex1 format):</p>
  <textarea id="inputText" placeholder="A&#10;B&#10;C"></textarea>

  <button onclick="convertText()">Convert</button>

  <p>Output (ex2 format):</p>
  <div class="output" id="outputText"></div>

  <script>
    function convertText() {
      const input = document.getElementById("inputText").value;

      const lines = input
        .split("\n")
        .map(line => line.trim())
        .filter(line => line !== "");

      const result = lines.join(" | ");

      document.getElementById("outputText").innerText = result;
    }
  </script>

</body>
</html>
